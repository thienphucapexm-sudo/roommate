<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RoomMate - Quản Lý Nhà Trọ</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Bootstrap Icons CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Root Container cho Layout App -->
    <div id="app" data-testid="app-root"></div>

    <!-- Container chứa Toast thông báo -->
    <div
      id="toast-container"
      class="toast-container position-fixed bottom-0 end-0 p-3"
      style="z-index: 1090"
      data-testid="toast-container"
    ></div>

    <!-- Modal Xóa / Xác nhận dùng chung -->
    <div
      class="modal fade"
      id="global-confirm-modal"
      tabindex="-1"
      aria-hidden="true"
      data-testid="global-confirm-modal"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="confirm-modal-title">Xác nhận</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body" id="confirm-modal-body">
            Bạn có chắc chắn muốn thực hiện thao tác này?
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
              data-testid="btn-confirm-cancel"
            >
              Hủy bỏ
            </button>
            <button
              type="button"
              class="btn btn-danger"
              id="confirm-modal-btn-action"
              data-testid="btn-confirm-ok"
            >
              Đồng ý
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap 5 JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
